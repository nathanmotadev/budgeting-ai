# Perfil usado pelo `./gradlew test`: H2 em memória no lugar do MySQL.
spring.datasource.url=jdbc:h2:mem:budgeting;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.docker.compose.enabled=false

# Sem OPENAI_API_KEY o contexto sobe com uma chave falsa (nenhuma chamada real é feita nos testes unitários).
# Os testes *IT só rodam quando a variável OPENAI_API_KEY existe.
spring.ai.openai.api-key=${OPENAI_API_KEY:test-key}
